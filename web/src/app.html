<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#06090b" />
		<style>
			html {
				background: #06090b;
			}
			html[data-theme="light"] {
				background: #f3f6f7;
			}
		</style>
		<script>
			// the saved theme before anything paints, so it doesn't flash
			try {
				const t = localStorage.getItem("theme");
				if (
					t === "light" ||
					(t === "system" && matchMedia("(prefers-color-scheme: light)").matches)
				) {
					document.documentElement.dataset.theme = "light";
					document.querySelector('meta[name="theme-color"]').content = "#f3f6f7";
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
