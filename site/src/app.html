<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#06090b" />
		<script>
			document.documentElement.classList.add("js");
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// the router restores scroll only after it loads, so a reload would paint the top first
			addEventListener("pagehide", () => sessionStorage.setItem("reload-scroll", scrollY));
			if (performance.getEntriesByType("navigation")[0]?.type === "reload")
				scrollTo(0, Number(sessionStorage.getItem("reload-scroll")));
		</script>
	</body>
</html>
