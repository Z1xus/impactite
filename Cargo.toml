[package]
name = "impactite"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Z1xus"]
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
mimalloc = "0.1.52"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = "deny"
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
