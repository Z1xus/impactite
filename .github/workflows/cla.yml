name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA and I agree to it'
    steps:
      # v2.6.1
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: z1xus,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA and I agree to it
          custom-notsigned-prcomment: Thanks for the pull request. impactite is AGPL and also sold under a commercial license, so every contribution goes under a short [contributor license agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md). Please read it, then reply with the line below.
          custom-allsigned-prcomment: Everyone in this pull request has signed the CLA, thank you.
