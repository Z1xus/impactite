name: docker

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          gh release download "$TAG" -p 'impactite-*-unknown-linux-musl.tar.xz'
          mkdir -p dist
          for arch in x86_64:amd64 aarch64:arm64; do
            tar xJf "impactite-${arch%%:*}-unknown-linux-musl.tar.xz"
            mv "impactite-${arch%%:*}-unknown-linux-musl/impactite" "dist/impactite-${arch##*:}"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
            ghcr.io/${{ github.repository }}:latest
