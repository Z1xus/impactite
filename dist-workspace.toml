[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# gzip, so `impactite update` unpacks it with what it already has
unix-archive = ".tar.gz"
# Whether to install an updater program
install-updater = false
# The web dashboard is embedded, so it builds first
github-build-setup = "../build-setup.yml"
# Publish a scratch image after the release
publish-jobs = ["./docker"]

[dist.github-custom-job-permissions]
docker = { contents = "read", packages = "write" }
